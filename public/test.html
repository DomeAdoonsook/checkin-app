<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทดสอบเครื่อง</title>
<style>body{font:16px system-ui;padding:16px;background:#fff;color:#111}li{margin:8px 0}.ok{color:#15803d}.bad{color:#b91c1c}</style>
</head><body>
<h2>ทดสอบเครื่อง</h2>
<p id="s" class="bad">❌ JavaScript ยังไม่ทำงาน</p>
<ul id="r"></ul>
<script>
function add(ok, t){var l=document.createElement('li');l.className=ok?'ok':'bad';l.textContent=(ok?'✅ ':'❌ ')+t;document.getElementById('r').appendChild(l)}
var s=document.getElementById('s');s.className='ok';s.textContent='✅ JavaScript ทำงาน';
add(true,'เบราว์เซอร์: '+navigator.userAgent);
try{localStorage.setItem('t','1');localStorage.removeItem('t');add(true,'localStorage ใช้ได้')}catch(e){add(false,'localStorage ใช้ไม่ได้: '+e.message)}
add(!!navigator.geolocation,'Geolocation API');
add(!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia),'กล้อง (getUserMedia)');
add(typeof crypto!=='undefined'&&!!crypto.randomUUID,'crypto.randomUUID');
add('noModule' in HTMLScriptElement.prototype,'ES modules');
fetch('https://iyofhamskpsgiiuttopg.supabase.co/auth/v1/health',{headers:{apikey:'sb_publishable_i3HZoxJ38_2O8JywRKGhbA_2M2Ldwu0'}})
 .then(function(r){add(r.ok,'ติดต่อ Supabase ได้ (HTTP '+r.status+')')})
 .catch(function(e){add(false,'ติดต่อ Supabase ไม่ได้: '+e.message)});
</script>
<p><a href="./">ไปหน้าแอป</a></p>
</body></html>
